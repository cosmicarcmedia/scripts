<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PowerFlag, moving camera cuts</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #14284B; color: #F4F1EA; font: 16px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 56px; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: 0.01em; }
  p.lede { margin: 0 0 28px; color: #C9D2E3; max-width: 60ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  figure { margin: 0; }
  video { width: 100%; aspect-ratio: 9 / 16; background: #0b1730; border-radius: 10px; display: block; }
  figcaption { margin-top: 8px; font-weight: 600; }
  footer { margin-top: 32px; color: #8FA0BF; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>PowerFlag, moving camera cuts</h1>
  <p class="lede">The same deploy in three settings with the camera walking around the unit. These are look and motion tests; the locked shots in the email are the reference for the mechanism.</p>
  <div class="grid">
    <figure>
      <video controls playsinline preload="metadata" src="powerflag-porch-orbit.mp4"></video>
      <figcaption>Porch</figcaption>
    </figure>
    <figure>
      <video controls playsinline preload="metadata" src="powerflag-ranch-orbit.mp4"></video>
      <figcaption>Ranch gate pillar</figcaption>
    </figure>
    <figure>
      <video controls playsinline preload="metadata" src="powerflag-bank-orbit.mp4"></video>
      <figcaption>Bank entrance</figcaption>
    </figure>
  </div>
  <footer>Cosmic Arc Media for Texas Select Insurance. Private review link, please do not share.</footer>
</main>
</body>
</html>
